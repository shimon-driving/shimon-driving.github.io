<!-- תפריט נגישות – בלי שירות חיצוני. ההגדרות נשמרות בדפדפן של הגולש. -->
<style>
  .a11y-btn { position: fixed; bottom: 20px; right: 20px; z-index: 40; width: 56px; height: 56px; border-radius: 50%; border: 3px solid #FFD21F; background: #1A4FA0; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.35); padding: 0; }
  .a11y-btn svg { width: 32px; height: 32px; fill: currentColor; }
  .a11y-panel { position: fixed; bottom: 88px; right: 20px; z-index: 41; width: 290px; max-width: calc(100vw - 40px); background: #fff; color: #17181A; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.4); padding: 18px; font-family: 'Rubik', Arial, sans-serif; direction: rtl; }
  .a11y-panel[hidden] { display: none; }
  .a11y-panel h2 { margin: 0 0 12px; font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
  .a11y-close { background: none; border: 0; font-size: 26px; line-height: 1; cursor: pointer; color: #17181A; min-width: 44px; min-height: 44px; }
  .a11y-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .a11y-grid button { font: inherit; font-size: 14px; min-height: 48px; padding: 8px; border: 2px solid #D5D1C8; border-radius: 10px; background: #F3EEE4; color: #17181A; cursor: pointer; }
  .a11y-grid button[aria-pressed="true"] { background: #1A4FA0; border-color: #1A4FA0; color: #fff; }
  .a11y-grid .a11y-reset { grid-column: 1 / -1; background: #fff; }
  .a11y-panel a { display: block; margin-top: 12px; text-align: center; color: #1A4FA0; font-weight: 700; font-size: 15px; }
  .a11y-btn:focus-visible, .a11y-panel button:focus-visible, .a11y-panel a:focus-visible { outline: 3px solid #FFD21F; outline-offset: 2px; }
  @media (max-width: 860px) { .a11y-btn { width: 52px; height: 52px; bottom: 16px; right: 16px; } .a11y-panel { bottom: 80px; right: 16px; } }

  /* מצבי נגישות */
  html.a11y-zoom-1 body { zoom: 1.15; }
  html.a11y-zoom-2 body { zoom: 1.3; }
  html.a11y-gray { filter: grayscale(1); }
  html.a11y-contrast body, html.a11y-contrast main *, html.a11y-contrast header *, html.a11y-contrast footer *, html.a11y-contrast header, html.a11y-contrast footer { background-color: #000 !important; background-image: none !important; color: #fff !important; border-color: #fff !important; text-shadow: none !important; }
  html.a11y-contrast a, html.a11y-contrast a * { color: #FFEB3B !important; }
  html.a11y-contrast .a11y-panel a { color: #1A4FA0 !important; }
  html.a11y-links a { text-decoration: underline !important; outline: 2px dashed currentColor; outline-offset: 2px; }
  html.a11y-font body, html.a11y-font body * { font-family: Arial, Helvetica, sans-serif !important; letter-spacing: .02em; }
  html.a11y-still *, html.a11y-still *::before, html.a11y-still *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
</style>

<button type="button" class="a11y-btn" id="a11y-btn" aria-label="תפריט נגישות" aria-expanded="false" aria-controls="a11y-panel">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>
</button>

<div class="a11y-panel" id="a11y-panel" role="dialog" aria-label="הגדרות נגישות" hidden>
  <h2>נגישות <button type="button" class="a11y-close" id="a11y-close" aria-label="סגירת תפריט הנגישות">×</button></h2>
  <div class="a11y-grid">
    <button type="button" data-a11y="zoom">הגדלת טקסט</button>
    <button type="button" data-a11y="contrast" aria-pressed="false">ניגודיות גבוהה</button>
    <button type="button" data-a11y="gray" aria-pressed="false">גווני אפור</button>
    <button type="button" data-a11y="links" aria-pressed="false">הדגשת קישורים</button>
    <button type="button" data-a11y="font" aria-pressed="false">גופן קריא</button>
    <button type="button" data-a11y="still" aria-pressed="false">עצירת אנימציות</button>
    <button type="button" class="a11y-reset" data-a11y="reset">איפוס הגדרות</button>
  </div>
  <a href="{{ '/accessibility/' | relative_url }}">להצהרת הנגישות</a>
</div>

<script>
(function () {
  var root = document.documentElement, KEY = 'a11y-settings';
  var btn = document.getElementById('a11y-btn'), panel = document.getElementById('a11y-panel');
  var toggles = ['contrast', 'gray', 'links', 'font', 'still'];
  var s = {};
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { s = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function apply() {
    root.classList.remove('a11y-zoom-1', 'a11y-zoom-2');
    if (s.zoom) root.classList.add('a11y-zoom-' + s.zoom);
    toggles.forEach(function (t) {
      root.classList.toggle('a11y-' + t, !!s[t]);
      var b = panel.querySelector('[data-a11y="' + t + '"]');
      if (b) b.setAttribute('aria-pressed', s[t] ? 'true' : 'false');
    });
    var z = panel.querySelector('[data-a11y="zoom"]');
    z.textContent = s.zoom ? 'הגדלת טקסט (' + (s.zoom === 1 ? '115%' : '130%') + ')' : 'הגדלת טקסט';
  }
  function open(v) {
    panel.hidden = !v; btn.setAttribute('aria-expanded', v ? 'true' : 'false');
    if (v) panel.querySelector('button[data-a11y]').focus();
  }
  btn.addEventListener('click', function () { open(panel.hidden); });
  document.getElementById('a11y-close').addEventListener('click', function () { open(false); btn.focus(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) { open(false); btn.focus(); } });
  panel.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a11y]'); if (!b) return;
    var k = b.getAttribute('data-a11y');
    if (k === 'reset') s = {};
    else if (k === 'zoom') s.zoom = ((s.zoom || 0) + 1) % 3;
    else s[k] = !s[k];
    save(); apply();
  });
  apply();
})();
</script>
