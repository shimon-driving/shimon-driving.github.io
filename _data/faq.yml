items:
  - question: כמה שיעורים צריך לעשות?
    answer: לרכב פרטי (דרגה B) המינימום שנקבע בחוק הוא 28 שיעורים. בפועל, כל תלמיד מתקדם בקצב שלו.
  - question: כמה זמן לוקח להוציא רישיון?
    answer: תלוי בכם. עם שיעורים צפופים אפשר לסיים גם בתוך חודש.
  - question: מאיזה גיל אפשר להתחיל?
    answer: מבחן תיאוריה אפשר לעשות מגיל 15.5, שיעורי נהיגה מתחילים מגיל 16.5, ואת הרישיון מקבלים מגיל 17.
  - question: חייבים לעבור תיאוריה לפני שמתחילים שיעורים?
    answer: לא חובה, אבל כדאי. אפשר להתחיל לנהוג במקביל ללימוד התיאוריה. את מבחן התיאוריה צריך לעבור לפני שניגשים לטסט.
  - question: איך בנוי מבחן התיאוריה?
    answer: 30 שאלות אמריקאיות, כ-40 דקות. כדי לעבור צריך לענות נכון על 26 שאלות לפחות. אפשר להיבחן בעברית, ערבית, רוסית, אמהרית, אנגלית, צרפתית וספרדית.
  - question: כמה זמן מבחן התיאוריה בתוקף?
    answer: 5 שנים מיום המבחן.
  - question: אוטומט או ידני – מה כדאי לבחור?
    answer: באוטומט לומדים מהר יותר ונוהגים בפחות לחץ, אבל רישיון על אוטומט מאפשר לנהוג רק ברכב אוטומטי. רישיון על ידני מאפשר לנהוג בשניהם. אם לא בטוחים, דברו איתי ונחליט יחד.
  - question: מה זה טסט פנימי?
    answer: לפני הטסט של משרד התחבורה עושים מבחן פנימי עם המורה. כך אנחנו מוודאים שאתם באמת מוכנים, ורק אז אני מגיש אתכם לטסט.
  - question: נכשלתי בטסט. מה עכשיו?
    answer: קורה לטובים ביותר. עושים עוד כמה שיעורים על מה שהבוחן העיר, ואז אני מגיש אתכם שוב. אם אתם חושבים שהתוצאה לא הוגנת, אפשר להגיש ערר תוך 7 ימים.
  - question: מה זה תקופת הליווי אחרי הרישיון?
    answer: |-
      בחצי השנה הראשונה נוהגים עם מלווה. בשלושת החודשים הראשונים הליווי הוא בכל שעות היממה, ובשלושת החודשים הבאים רק בלילה (21:00–06:00).
      מלווה יכול להיות מי שבן 24 ומעלה עם רישיון 5 שנים לפחות, או בן 30 ומעלה עם רישיון 3 שנים לפחות.
