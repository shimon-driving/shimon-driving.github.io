about:
  label: מי אני
  title: כשמבינים – זוכרים.
  text: כבר מעל 35 שנה אני מלמד נהיגה באילת. אני מאמין שנהג טוב הוא נהג שמבין למה, ולא רק יודע מה. לכן כל שיעור בנוי על הסבר – למה נותנים זכות קדימה כאן, למה מאטים שם. כשמבינים, זוכרים. וכשזוכרים, נוהגים בביטחון.
  image: /assets/images/shimon.jpg
  image_alt: שמעון כרמונה ליד רכב הלימוד באילת
  points:
    - icon: bulb
      title: הבנה, לא שינון
      text: חוקי התנועה מוסברים, לא מדוקלמים.
    - icon: clock
      title: סבלנות
      text: כל תלמיד בקצב שלו, בלי לחץ מיותר.
    - icon: calendar
      title: גמישות
      text: ימים א'–ה', ובסופ"ש לחיילים בתיאום.

routes:
  label: מה לומדים
  title: שלוש דרכים לרישיון
  text: "רישיון לרכב פרטי (B): שיעורי נהיגה באוטומט או בידני, ושיעורי תיאוריה פרטיים."
  items:
    - title: אוטומט
      highlight: false
      text: נהיגה חלקה בלי החלפת הילוכים. אידיאלי למתחילים שרוצים להתרכז בכביש.
      bullets:
        - קל ומהיר יותר ללמידה
        - פחות מתח בפקקים ובעליות
        - מושלם לנהיגה עירונית
    - title: ידני
      highlight: false
      text: שליטה מלאה ברכב עם תיבת הילוכים ידנית. למי שרוצה לנהוג בכל רכב, בכל מצב.
      bullets:
        - החלפת הילוכים ועבודה עם מצמד
        - שליטה בעליות ובירידות
        - רישיון שמאפשר לנהוג בכל סוגי הרכב
    - title: שיעורי תיאוריה
      highlight: true
      text: שיעורים פרטיים, אחד על אחד, לקראת מבחן התיאוריה. מבינים את החוקים במקום לשנן תשובות.
      bullets:
        - חומר לימוד מלא ומסודר
        - תרגול על מבחנים אמיתיים
        - הסברים ברורים וסבלניים

